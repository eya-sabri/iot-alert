<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Schéma de câblage : ESP32 + DHT11</text>

  <!-- ESP32 -->
  <rect x="50" y="70" width="230" height="240" rx="10" fill="#1f2937"/>
  <text x="165" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">ESP32</text>
  <text x="165" y="120" text-anchor="middle" font-size="12" fill="#9ca3af">carte de développement</text>
  <rect x="120" y="270" width="90" height="40" rx="4" fill="#374151"/>
  <text x="165" y="295" text-anchor="middle" font-size="12" fill="#ffffff">USB</text>
  <!-- pins -->
  <circle cx="280" cy="160" r="6" fill="#dc2626"/><text x="268" y="164" text-anchor="end" font-size="14" fill="#ffffff">3V3</text>
  <circle cx="280" cy="200" r="6" fill="#2563eb"/><text x="268" y="204" text-anchor="end" font-size="14" fill="#ffffff">GPIO 4</text>
  <circle cx="280" cy="240" r="6" fill="#111827" stroke="#9ca3af"/><text x="268" y="244" text-anchor="end" font-size="14" fill="#ffffff">GND</text>

  <!-- DHT11 -->
  <rect x="520" y="110" width="190" height="170" rx="10" fill="#38bdf8"/>
  <text x="615" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">DHT11</text>
  <text x="615" y="160" text-anchor="middle" font-size="12" fill="#0c4a6e">température / humidité</text>
  <circle cx="520" cy="190" r="6" fill="#dc2626"/><text x="534" y="194" font-size="14" fill="#0c4a6e">VCC</text>
  <circle cx="520" cy="230" r="6" fill="#2563eb"/><text x="534" y="234" font-size="14" fill="#0c4a6e">DATA</text>
  <circle cx="520" cy="270" r="6" fill="#111827" stroke="#0c4a6e"/><text x="534" y="274" font-size="14" fill="#0c4a6e">GND</text>

  <!-- fils -->
  <path d="M286 160 H400 V190 H514" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path d="M286 200 H430 V230 H514" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M286 240 H460 V270 H514" fill="none" stroke="#111827" stroke-width="3"/>

  <text x="380" y="338" text-anchor="middle" font-size="13" fill="#4b5563">Liaison série USB vers le PC (115200 bauds) : alimentation + données JSON</text>
</svg>
